<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- CRT Scanline Pattern -->
    <pattern id="scan" width="2" height="2" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="2" y2="0" stroke="#39ff14" stroke-width="0.5" opacity="0.15" />
    </pattern>
  </defs>
  
  <!-- Dark Background with rounded corners -->
  <rect width="100" height="100" rx="20" fill="#050a05" />
  
  <!-- Cyberpunk Hexagon Border -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="none" stroke="#1a2a1a" stroke-width="4" />
  
  <!-- Terminal Prompt (>) -->
  <polyline points="32,35 55,50 32,65" fill="none" stroke="#39ff14" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  
  <!-- Cyan Cursor (_) -->
  <rect x="62" y="56" width="12" height="8" rx="2" fill="#00ffff" filter="url(#neonGlow)" />
  
  <!-- Scanlines Overlay -->
  <rect width="100" height="100" rx="20" fill="url(#scan)" />
</svg>